name: Backend CI/CD - Render Deployment

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'render.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'render.yaml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip Maven test suite'
        required: false
        type: boolean
        default: false
      clear_cache:
        description: 'Clear Render build cache during deployment'
        required: false
        type: boolean
        default: false

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =========================================================================
  # 1. Backend Build, Test & Package
  # =========================================================================
  build-and-test:
    name: Build & Test Spring Boot Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Verify Maven & Java Environment
        run: |
          mvn -version
          java -version

      - name: Run Maven Unit & Integration Tests
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: mvn clean test -B

      - name: Package Production Executable JAR
        run: mvn package -DskipTests -B

      - name: Locate and Rename JAR
        run: |
          JAR_FILE=$(ls target/edlearn-backend-*.jar | head -n 1)
          cp "$JAR_FILE" target/backend-production.jar
          echo "Production JAR packaged: $JAR_FILE"

      - name: Upload Backend Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-production-jar
          path: backend/target/backend-production.jar
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 2. Automated Deployment to Render & Health Endpoint Verification
  # =========================================================================
  deploy-to-render:
    name: Deploy to Render & Verify Health
    needs: build-and-test
    if: ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        id: trigger_deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          CLEAR_CACHE: ${{ github.event.inputs.clear_cache }}
        run: |
          set -e
          echo "Initiating automated deployment to Render..."

          # Strategy A: Render Authenticated REST API (provides live deployment tracking)
          if [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "Using Render REST API deployment method..."
            CACHE_PARAM="do_not_clear"
            if [ "$CLEAR_CACHE" = "true" ]; then
              CACHE_PARAM="clear"
            fi

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "{\"clearCache\": \"${CACHE_PARAM}\"}")

            HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              DEPLOY_ID=$(echo "$BODY" | jq -r '.id // .deploy.id // empty')
              echo "Deployment triggered successfully! Deploy ID: ${DEPLOY_ID}"
              echo "deploy_id=${DEPLOY_ID}" >> "$GITHUB_OUTPUT"
              echo "method=api" >> "$GITHUB_OUTPUT"

              # Poll Render deployment status until live
              if [ -n "$DEPLOY_ID" ]; then
                echo "Tracking deployment status on Render..."
                MAX_ATTEMPTS=40
                ATTEMPT=1
                while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
                  POLL_RESP=$(curl -s -H "Authorization: Bearer ${RENDER_API_KEY}" \
                    "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}")
                  STATUS=$(echo "$POLL_RESP" | jq -r '.status // empty')
                  echo "[$(date +'%H:%M:%S')] Render deploy status: ${STATUS} (attempt ${ATTEMPT}/${MAX_ATTEMPTS})"

                  if [ "$STATUS" = "live" ]; then
                    echo "Render service is marked as LIVE!"
                    break
                  elif [ "$STATUS" = "build_failed" ] || [ "$STATUS" = "canceled" ] || [ "$STATUS" = "deactivated" ]; then
                    echo "Render deployment failed with terminal status: ${STATUS}"
                    echo "$POLL_RESP" | jq .
                    exit 1
                  fi

                  sleep 10
                  ATTEMPT=$((ATTEMPT + 1))
                done

                if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
                  echo "Warning: Render deployment tracking timed out. Proceeding to direct health endpoint verification..."
                fi
              fi
            else
              echo "Render API call returned HTTP status ${HTTP_CODE}."
              echo "Response: ${BODY}"
              exit 1
            fi

          # Strategy B: Render Deploy Hook Webhook
          elif [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Using Render Deploy Hook URL method..."
            HOOK_URL="$RENDER_DEPLOY_HOOK_URL"
            if [ "$CLEAR_CACHE" = "true" ]; then
              HOOK_URL="${HOOK_URL}&clearCache=clear"
            fi

            HOOK_RESP=$(curl -s -w "\n%{http_code}" -X POST "$HOOK_URL")
            HOOK_CODE=$(echo "$HOOK_RESP" | tail -n 1)
            HOOK_BODY=$(echo "$HOOK_RESP" | sed '$d')

            if [ "$HOOK_CODE" -ge 200 ] && [ "$HOOK_CODE" -lt 300 ]; then
              echo "Render Deploy Hook triggered successfully (HTTP ${HOOK_CODE})."
              echo "method=hook" >> "$GITHUB_OUTPUT"
            else
              echo "Render Deploy Hook failed with HTTP status ${HOOK_CODE}."
              echo "Response: ${HOOK_BODY}"
              exit 1
            fi

          else
            echo "Error: Neither (RENDER_API_KEY & RENDER_SERVICE_ID) nor RENDER_DEPLOY_HOOK_URL is configured."
            echo "Please configure either secret in your GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Verify Backend Health Endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          set -e
          # If BACKEND_URL secret is not defined, attempt to inform user
          if [ -z "$BACKEND_URL" ]; then
            echo "Warning: BACKEND_URL secret is not set."
            echo "Please set BACKEND_URL in GitHub Secrets (e.g., https://edlearn-backend.onrender.com) to enable health check verification."
            echo "Skipping health check step."
            exit 0
          fi

          # Remove trailing slash if present
          CLEAN_URL="${BACKEND_URL%/}"
          HEALTH_ENDPOINT="${CLEAN_URL}/api/db/health"
          ROOT_ENDPOINT="${CLEAN_URL}/"

          echo "Target Backend Health Endpoint: ${HEALTH_ENDPOINT}"
          echo "Target Backend Root Endpoint:   ${ROOT_ENDPOINT}"

          # Allow container startup grace period on Render (spin-up on free tier can take up to 2-3 minutes)
          echo "Beginning health verification with retry loop (up to 30 attempts, 10s interval)..."
          MAX_RETRIES=30
          COUNT=1
          SUCCESS=0

          while [ $COUNT -le $MAX_RETRIES ]; do
            echo -n "[$(date +'%H:%M:%S')] Checking ${HEALTH_ENDPOINT} (attempt ${COUNT}/${MAX_RETRIES})... "
            
            # Fetch HTTP status code and response body
            HTTP_RESPONSE=$(curl -s -o /tmp/health_body.txt -w "%{http_code}" --max-time 15 "$HEALTH_ENDPOINT" || echo "000")
            
            if [ "$HTTP_RESPONSE" = "200" ]; then
              echo "HTTP 200 OK!"
              echo "Health Check Payload:"
              cat /tmp/health_body.txt
              echo ""
              SUCCESS=1
              break
            else
              # Also check if root endpoint responds 200 as secondary check
              ROOT_RESPONSE=$(curl -s -o /tmp/root_body.txt -w "%{http_code}" --max-time 15 "$ROOT_ENDPOINT" || echo "000")
              if [ "$ROOT_RESPONSE" = "200" ]; then
                echo "Root endpoint returned HTTP 200 OK (Server online)."
                SUCCESS=1
                break
              fi
              
              echo "Received HTTP status ${HTTP_RESPONSE} (Root status: ${ROOT_RESPONSE}). Retrying in 10s..."
            fi

            sleep 10
            COUNT=$((COUNT + 1))
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "Health verification timed out after ${MAX_RETRIES} attempts."
            echo "Backend at ${CLEAN_URL} failed to respond with HTTP 200 OK."
            exit 1
          fi

          echo "Backend deployment and health check verified successfully!"

      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "## 🌐 Render Backend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Build & Test | ${{ needs.build-and-test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Render Trigger | ${{ steps.trigger_deploy.outcome == 'success' && '✅ Triggered' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🩺 Health Status | ${{ steps.trigger_deploy.outcome == 'success' && '✅ Verified Healthy' || '⚠️ Pending / Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌿 Target Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔖 Commit SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔗 Service URL | ${{ secrets.BACKEND_URL || 'Not configured in secrets' }} |" >> $GITHUB_STEP_SUMMARY
