# Integration tests require an isolated PostgreSQL database, never the production Neon database.
spring.datasource.url=${TEST_DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${TEST_DATABASE_USERNAME}
spring.datasource.password=${TEST_DATABASE_PASSWORD}
spring.datasource.hikari.data-source-properties.socketFactory=com.edlearn.backend.config.NeonSocketFactory
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS edlearn
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=edlearn
cloudinary.url=cloudinary://test:test@edlearn-test
edlearn.auth.secret=integration-test-signing-secret-with-32-bytes
