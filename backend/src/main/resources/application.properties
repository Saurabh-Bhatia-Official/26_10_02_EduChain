server.port=${PORT:${SERVER_PORT:5002}}
spring.application.name=edlearn-backend
edlearn.frontend.url=${EDLEARN_FRONTEND_URL:http://localhost:8080}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://ep-dark-lake-b3emihul-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/edlearndb?sslmode=require&currentSchema=edlearn&socketFactory=com.edlearn.backend.config.NeonSocketFactory}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:neondb_owner}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:npg_Vfwy7MXd2QuA}}
spring.datasource.hikari.data-source-properties.socketFactory=com.edlearn.backend.config.NeonSocketFactory
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=edlearn
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.open-in-view=false

# Signed portal access tokens. Configure the same strong secret on every backend replica.
edlearn.auth.secret=${EDLEARN_AUTH_SECRET:${JWT_SECRET:9a4f2b1d3e5c6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b}}
edlearn.leave.student-admin-second-stage=${EDLEARN_LEAVE_SECOND_APPROVAL:true}

