server.port=${PORT:${SERVER_PORT:5000}}
spring.application.name=edlearn-backend

# Local PostgreSQL defaults are used when database environment variables are absent.
# Production credentials must be supplied through the deployment environment.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/edlearndb?currentSchema=edlearn}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=edlearn
spring.jpa.open-in-view=false

# Signed portal access tokens. Configure the same strong secret on every backend replica.
edlearn.auth.secret=${EDLEARN_AUTH_SECRET:${JWT_SECRET:}}
edlearn.leave.student-admin-second-stage=${EDLEARN_LEAVE_SECOND_APPROVAL:true}

# Cloudinary credentials are provided by the environment, never committed in source.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.url=${CLOUDINARY_URL:}

# Multipart File Upload Config
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
